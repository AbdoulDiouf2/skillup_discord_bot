name: Deploy VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Wait for Tailscale path to VPS
        run: |
          for i in $(seq 1 10); do
            tailscale ping -c 1 --timeout 3s "${{ secrets.VPS_HOST }}" && break
            echo "Ping $i failed, retrying..."
            sleep 2
          done

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: maadec
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          script: |
            cd ~/infra/prod/skillup_discord_bot
            git pull origin main
            docker compose up -d --build

      - name: Notify Telegram (succès)
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ SkillUp déployé avec succès sur le VPS (commit ${{ github.sha }})."

      - name: Notify Telegram (échec)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Échec du déploiement SkillUp (commit ${{ github.sha }}). Voir : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
