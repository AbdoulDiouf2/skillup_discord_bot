services:
  skillup-bot:
    build: .
    image: skillup-bot:latest
    container_name: skillup-bot
    restart: unless-stopped
    command: python -m bot.main
    env_file: .env
    networks:
      - prod-net

  skillup-api:
    build: .
    image: skillup-api:latest
    container_name: skillup-api
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    networks:
      - prod-net

networks:
  prod-net:
    external: true
